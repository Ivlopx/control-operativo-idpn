<div id="document-routing">
  <p id="classification-summary" class="matrix-hint" role="status">Introduce el código para detectar su clasificación.</p>
  <fieldset id="classification-fields" hidden disabled style="border:0;padding:0;min-width:0;">
  <div class="form-group"><label for="matrix-scope">Clasificación</label><select id="matrix-scope"><option value="government">Procedimientos de Gobierno</option><option value="specific">Procedimientos Específicos</option><option value="manuals">Manuales del Sistema de Gestión</option></select></div>
  <div class="form-group"><label for="matrix-branch" id="matrix-branch-label">Procedimiento de Gobierno</label><select id="matrix-branch" required></select></div>
  <div class="form-group" id="matrix-area-field" hidden><label for="matrix-area">Área</label><select id="matrix-area"></select></div>
  <div class="form-row">
    <div class="form-group"><label for="matrix-type">Tipo</label><select id="matrix-type" required></select></div>
    <input type="hidden" id="matrix-number">
  </div>
  </fieldset>
  <p id="matrix-operation-note" class="matrix-hint"></p>
</div>
