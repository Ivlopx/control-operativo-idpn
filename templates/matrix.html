<div id="company-matrix-settings">
  <div class="tab-header">
    <h2>Matriz documental</h2>
    <p>Administra procedimientos, procesos, áreas y siglas de la empresa seleccionada.</p>
  </div>
  <div id="matrix-alert" role="status" class="matrix-message" hidden></div>
  <div class="matrix-layout" id="matrix-workspace" hidden>
    <div class="card matrix-admin">
      <h3>Estructura documental</h3>
      <form id="matrix-admin-form">
        <div class="form-group"><label for="matrix-name">Nombre de la empresa</label><input id="matrix-name" required></div>
        <details class="matrix-section">
          <summary>Tipos de documento y prefijos</summary>
          <p class="matrix-hint">Formatos y Formularios pueden compartir siglas. Los Formularios no almacenan archivos.</p>
          <div id="matrix-types"></div>
        </details>
        <details class="matrix-section matrix-category" id="matrix-government-section" open>
          <summary>Procedimientos de Gobierno</summary>
          <div class="matrix-section-title"><button id="matrix-add-government" type="button" class="btn btn-secondary">Agregar</button></div>
          <div id="matrix-government" class="matrix-tree"></div>
        </details>
        <details class="matrix-section matrix-category" id="matrix-specific-section" open>
          <summary>Procedimientos Específicos</summary>
          <div class="matrix-section-title"><button id="matrix-add-process" type="button" class="btn btn-secondary">Agregar proceso</button></div>
          <div id="matrix-specific" class="matrix-tree"></div>
        </details>
        <button class="btn btn-primary" type="submit" id="matrix-save">Guardar matriz de esta empresa</button>
      </form>
    </div>
  </div>
</div>
